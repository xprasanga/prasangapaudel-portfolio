name: Build executable portfolio notebooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib seaborn jupyter nbformat nbclient nbconvert

      - name: Execute existing portfolio builds
        run: python tools/build_portfolio_notebooks.py

      - name: Build the notebook-style manuscript visualization
        run: |
          python tools/build_python_manuscript_notebook.py
          python -m jupyter nbconvert --to html --output-dir manuscript-visualization manuscript-visualization/manuscript_visualization.ipynb

      - name: Publish generated notebook outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript-visualization/manuscript_visualization.ipynb manuscript-visualization/manuscript_visualization.html sql-projects/SQL_Data_Exploration.ipynb sql-projects/SQL_Data_Exploration.html sql-projects/database/sakila_portfolio.sqlite sql-projects/sql-exploration-queries.sql sql-projects/README.md
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Build executed Python and SQL portfolio notebooks [skip ci]"
          git push
