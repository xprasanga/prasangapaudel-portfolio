name: Build Python Quarto notebook site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib seaborn jupyter nbformat nbclient nbconvert

      - name: Build and execute the single Python notebook
        run: python tools/build_python_manuscript_notebook.py

      - name: Render the Quarto website
        run: quarto render

      - name: Publish generated notebook and website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs manuscript-visualization/python_analysis.ipynb
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Publish Python analysis as a Quarto notebook [skip ci]"
          git push
