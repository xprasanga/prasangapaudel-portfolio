name: Build and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib seaborn jupyter nbformat nbconvert

      - name: Build existing SQL notebook artifacts
        run: python tools/build_portfolio_notebooks.py

      - name: Render the Quarto website
        run: quarto render

      - name: Publish generated website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs sql-projects/SQL_Data_Exploration.ipynb sql-projects/SQL_Data_Exploration.html sql-projects/database/sakila_portfolio.sqlite sql-projects/sql-exploration-queries.sql sql-projects/README.md
          if git diff --cached --quiet; then
            echo "No generated changes to publish."
            exit 0
          fi
          git commit -m "Render Quarto website [skip ci]"
          git push
